services:
  nodalibre:
    # Nom historique conservé pendant la transition vers Nodalibre.
    image: liberchat/libre-claude:latest
    container_name: nodalibre
    ports:
      - "8173:80"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-}
      MISTRAL_API_KEYS: ${MISTRAL_API_KEYS:-}
    volumes:
      - nodalibre_data:/var/www/html/data
      - nodalibre_sandbox:/var/www/html/sandbox
    restart: unless-stopped

volumes:
  nodalibre_data:
  nodalibre_sandbox:
